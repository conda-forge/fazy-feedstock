{% set name = "fazy" %}
{% set version = "0.0.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fazy-{{ version }}.tar.gz
  sha256: b069171ddadfccd2a823a6a94fb3149c8805807f614099d46f499ab427d8c1b5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools ==68.0.0
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - f
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pomponchik/fazy
  summary: Lazy f-strings for everyone
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
