{% set name = "fazy" %}
{% set version = "0.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fazy-{{ version }}.tar.gz
  sha256: 3967af59c14fd4372a2e10af4ef1be96ce5ab8aa36e6c3fe57c92cdd91ace22f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools ==68.0.0
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - f
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pomponchik/fazy
  summary: Lazy f-strings for everyone
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
